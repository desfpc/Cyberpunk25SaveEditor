[package]
name = "nightcity-save-editor"
version = "0.1.2"
edition = "2021"
authors = ["Sergei Peshalov"]
homepage = "https://github.com/desfpc"
repository = "https://github.com/desfpc/Cyberpunk25SaveEditor"
license = "GPL-3.0-only"
description = "Native Rust save editor for Cyberpunk 2077 2.5"

[dependencies]
anyhow = "1"
eframe = "0.29"
rfd = "0.15"
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"

[profile.release]
lto = "thin"
strip = true
